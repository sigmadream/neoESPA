[project]
name = "backend"
version = "3.0.0"
description = "neoESPA 학습 관리 시스템 백엔드 API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.135.1",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.11.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "sqlmodel>=0.0.37",
    "uvicorn>=0.41.0",
    "websockets>=15.0.1",
]

[project.scripts]
neoespa-admin = "app.cli:main"

[tool.black]
line-length = 80

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "hypothesis>=6.131.0",
    "pytest-cov>=6.2.1",
]
