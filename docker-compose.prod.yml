services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////database/database.sqlite
      - JWT_SECRET=${JWT_SECRET}
      - APP_ENV=production
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - NEOESPA_SUPPORT_DIR=/supportFiles
    volumes:
      - ./supportFiles:/supportFiles:ro
      - production_db:/database
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  production_db:
